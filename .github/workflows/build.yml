name: Build PS4 PKG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl libicu-dev clang lld python3

      - name: Install libssl1.1 for PkgTool.Core if available
        run: |
          base="http://security.ubuntu.com/ubuntu/pool/main/o/openssl/"
          ver="$(curl -fsSL "$base" | grep -oE 'libssl1\.1_1\.1\.1f-[0-9a-z.~+]+_amd64\.deb' | sed -E 's/^libssl1\.1_(.*)_amd64\.deb$/\1/' | sort -V | tail -1)"
          if [ -n "$ver" ]; then
            curl -fsSL -o /tmp/libssl1.1.deb "${base}libssl1.1_${ver}_amd64.deb"
            sudo dpkg -i /tmp/libssl1.1.deb || sudo apt-get install -f -y
          fi

      - name: Download OpenOrbis v0.5.4
        run: |
          curl -fsSL https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz -o /tmp/oo.tar.gz
          mkdir -p "$HOME/oo"
          tar -xzf /tmp/oo.tar.gz -C "$HOME/oo"
          OO_ROOT="$(dirname "$(find "$HOME/oo" -name link.x | head -1)")"
          test -n "$OO_ROOT"
          echo "OO_PS4_TOOLCHAIN=$OO_ROOT" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          CLANG="$(find "$OO_PS4_TOOLCHAIN" -type f -name clang | head -1)"
          LLD="$(find "$OO_PS4_TOOLCHAIN" -type f -name ld.lld | head -1)"
          make CC="${CLANG:-clang}" LD="${LLD:-ld.lld}"
          test -s IV0000-EMLB00001_00-EMULATORLAB00001.pkg

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: ps4-homebrew-pkg
          path: IV0000-EMLB00001_00-EMULATORLAB00001.pkg
          if-no-files-found: error
          retention-days: 30
